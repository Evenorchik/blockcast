<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор набора текста</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #1c1c1e;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid #2c2c2e;
        }

        .contact-name {
            font-size: 16px;
            font-weight: 600;
        }

        .contact-subtitle {
            font-size: 12px;
            color: #8e8e93;
            margin-top: 2px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 20px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.received {
            background: #3a3a3c;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        .message.sent {
            background: #0a84ff;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-width: 70%;
        }

        .message-wrapper.sent {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-wrapper.received {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message-status {
            font-size: 11px;
            color: #8e8e93;
            padding: 0 5px;
            margin-top: 2px;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: #3a3a3c;
            padding: 12px 16px;
            border-radius: 20px;
            border-bottom-left-radius: 5px;
            max-width: 60px;
        }

        .typing-indicator.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        .typing-indicator .dots {
            display: inline-block;
        }

        .typing-indicator .dots span {
            animation: blink 1.4s infinite;
            animation-fill-mode: both;
        }

        .typing-indicator .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 80%, 100% {
                opacity: 0;
            }
            40% {
                opacity: 1;
            }
        }

        .input-container {
            background: #1c1c1e;
            padding: 10px 15px;
            border-top: 1px solid #2c2c2e;
        }

        .input-wrapper {
            background: #3a3a3c;
            border-radius: 20px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .text-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        .text-input::placeholder {
            color: #8e8e93;
        }

        .send-button {
            background: #0a84ff;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-button:hover {
            background: #0066cc;
        }

        .send-button:disabled {
            background: #3a3a3c;
            cursor: not-allowed;
        }

        .control-panel {
            background: #2c2c2e;
            padding: 20px;
            border-top: 1px solid #3a3a3c;
        }

        .control-panel h3 {
            margin-bottom: 15px;
            font-size: 14px;
            color: #8e8e93;
            text-transform: uppercase;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .control-group input[type="text"],
        .control-group input[type="number"] {
            width: 100%;
            padding: 10px;
            background: #3a3a3c;
            border: 1px solid #48484a;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }

        .control-group input[type="range"] {
            width: 100%;
        }

        .control-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #0a84ff;
            color: #fff;
        }

        .btn-primary:hover {
            background: #0066cc;
        }

        .btn-secondary {
            background: #3a3a3c;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #48484a;
        }

        .speed-value {
            display: inline-block;
            margin-left: 10px;
            color: #0a84ff;
            font-weight: 600;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: #fff;
            margin-left: 2px;
            animation: cursorBlink 1s infinite;
        }

        @keyframes cursorBlink {
            0%, 49% {
                opacity: 1;
            }
            50%, 100% {
                opacity: 0;
            }
        }

        .status {
            margin-top: 10px;
            padding: 10px;
            background: #3a3a3c;
            border-radius: 8px;
            font-size: 12px;
            color: #8e8e93;
            text-align: center;
        }

        .status.active {
            background: #1e3a1e;
            color: #30d158;
        }

        /* iOS Keyboard Styles - Dark Theme */
        .keyboard-container {
            background: #1c1c1e;
            padding: 8px 3px 5px 3px;
            border-top: 1px solid #2c2c2e;
            transition: all 0.3s ease;
        }

        .keyboard-container.hidden {
            display: none;
        }

        .keyboard-suggestions {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            padding: 0 3px;
        }

        .suggestion {
            flex: 1;
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 6px;
            padding: 8px;
            text-align: center;
            font-size: 14px;
            color: #fff;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 10px;
        }

        .key {
            background: #3a3a3c;
            border: none;
            border-radius: 4px;
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 23px;
            font-weight: 300;
            height: 46px;
            min-width: 33px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.05s ease;
            position: relative;
        }

        .key:active,
        .key.pressed {
            background: #5a5a5c;
            transform: scale(1.1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .key.pressed::before {
            content: attr(data-key);
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: #5a5a5c;
            border: 1px solid #6a6a6c;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 32px;
            color: #fff;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
            min-width: 50px;
            text-align: center;
        }

        .key.special {
            background: #2c2c2e;
            color: #fff;
            font-size: 15px;
            font-weight: 400;
        }

        .key.special:active,
        .key.special.pressed {
            background: #48484a;
        }

        .key.space {
            flex: 1;
            font-size: 15px;
        }

        .key.shift,
        .key.delete {
            min-width: 44px;
        }

        .keyboard-row:nth-child(3) {
            padding: 0 16px;
        }

        .keyboard-row:nth-child(4) {
            padding: 0 5px;
        }

        .keyboard-bottom {
            display: flex;
            gap: 5px;
            padding: 0 3px;
        }

        .key.number-toggle {
            min-width: 46px;
        }

        .key.emoji {
            min-width: 46px;
            font-size: 20px;
        }

        .key.send-key {
            min-width: 46px;
            background: #0a84ff;
            color: #fff;
        }

        .key.send-key:active,
        .key.send-key.pressed {
            background: #0066cc;
        }

        @keyframes keyPress {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        .key.animate {
            animation: keyPress 0.15s ease;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="contact-name">My queen ❤️</div>
        <div class="contact-subtitle">онлайн</div>
    </div>

    <div class="messages-container" id="messagesContainer">
        <div class="message-wrapper received">
            <div class="message received">What did you do</div>
        </div>
        <div class="message-wrapper sent">
            <div class="message sent">Nothing lol</div>
            <div class="message-status">Delivered</div>
        </div>
        <div class="typing-indicator" id="typingIndicator">
            <span class="dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
    </div>

    <div class="input-container">
        <div class="input-wrapper">
            <input type="text" class="text-input" id="currentText" placeholder="Сообщение" readonly>
            <button class="send-button" id="sendButton" disabled>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="keyboard-container" id="keyboard">
        <div class="keyboard-suggestions">
            <div class="suggestion">food</div>
            <div class="suggestion">coffee</div>
            <div class="suggestion">more</div>
        </div>

        <div class="keyboard-row">
            <button class="key" data-key="q">q</button>
            <button class="key" data-key="w">w</button>
            <button class="key" data-key="e">e</button>
            <button class="key" data-key="r">r</button>
            <button class="key" data-key="t">t</button>
            <button class="key" data-key="y">y</button>
            <button class="key" data-key="u">u</button>
            <button class="key" data-key="i">i</button>
            <button class="key" data-key="o">o</button>
            <button class="key" data-key="p">p</button>
        </div>

        <div class="keyboard-row">
            <button class="key" data-key="a">a</button>
            <button class="key" data-key="s">s</button>
            <button class="key" data-key="d">d</button>
            <button class="key" data-key="f">f</button>
            <button class="key" data-key="g">g</button>
            <button class="key" data-key="h">h</button>
            <button class="key" data-key="j">j</button>
            <button class="key" data-key="k">k</button>
            <button class="key" data-key="l">l</button>
        </div>

        <div class="keyboard-row">
            <button class="key special shift" data-key="⇧">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M12 5l-8 8h5v6h6v-6h5l-8-8z"/>
                </svg>
            </button>
            <button class="key" data-key="z">z</button>
            <button class="key" data-key="x">x</button>
            <button class="key" data-key="c">c</button>
            <button class="key" data-key="v">v</button>
            <button class="key" data-key="b">b</button>
            <button class="key" data-key="n">n</button>
            <button class="key" data-key="m">m</button>
            <button class="key special delete" data-key="⌫">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
                    <line x1="18" y1="9" x2="12" y2="15"/>
                    <line x1="12" y1="9" x2="18" y2="15"/>
                </svg>
            </button>
        </div>

        <div class="keyboard-bottom">
            <button class="key special number-toggle" data-key="123">123</button>
            <button class="key special emoji" data-key="🙂">🙂</button>
            <button class="key special space" data-key=" ">space</button>
            <button class="key special send-key" data-key="↵">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="control-panel">
        <h3>Панель управления</h3>

        <div class="control-group">
            <label for="textToType">Текст для набора:</label>
            <input type="text" id="textToType" placeholder="Введите текст, например: I love you" value="Just getting some coffee">
        </div>

        <div class="control-group">
            <label for="typingSpeed">
                Скорость набора: <span class="speed-value" id="speedValue">100 мс</span>
            </label>
            <input type="range" id="typingSpeed" min="50" max="500" value="100" step="10">
        </div>

        <div class="control-group">
            <label>
                <input type="checkbox" id="showKeyboard" checked> Показывать клавиатуру iOS
            </label>
        </div>

        <div class="control-group">
            <label>
                <input type="checkbox" id="showCursor"> Показывать курсор
            </label>
        </div>

        <div class="control-group">
            <label>
                <input type="checkbox" id="autoSend" checked> Автоматически отправлять сообщение
            </label>
        </div>

        <div class="control-group">
            <label>
                <input type="checkbox" id="autoReply" checked> Автоответы от собеседника
            </label>
        </div>

        <div class="control-buttons">
            <button class="btn btn-primary" id="startButton">▶ Начать набор</button>
            <button class="btn btn-secondary" id="stopButton">⏹ Остановить</button>
            <button class="btn btn-secondary" id="clearButton">🗑 Очистить чат</button>
        </div>

        <div class="status" id="status">Готов к работе</div>
    </div>

    <script>
        class TextTypingSimulator {
            constructor() {
                this.textToType = '';
                this.currentIndex = 0;
                this.typingSpeed = 100;
                this.isTyping = false;
                this.showCursor = false;
                this.autoSend = true;
                this.autoReply = true;
                this.typingTimeout = null;
                this.lastMessageStatus = null;

                // Random reply messages from the other person
                this.replyMessages = [
                    "Aww that's sweet ❤️",
                    "Can't wait to see you 😊",
                    "Miss you too babe 💕"
                ];

                this.initElements();
                this.initEventListeners();
            }

            initElements() {
                this.messagesContainer = document.getElementById('messagesContainer');
                this.currentTextInput = document.getElementById('currentText');
                this.textToTypeInput = document.getElementById('textToType');
                this.typingSpeedInput = document.getElementById('typingSpeed');
                this.speedValue = document.getElementById('speedValue');
                this.showKeyboardCheckbox = document.getElementById('showKeyboard');
                this.showCursorCheckbox = document.getElementById('showCursor');
                this.autoSendCheckbox = document.getElementById('autoSend');
                this.autoReplyCheckbox = document.getElementById('autoReply');
                this.startButton = document.getElementById('startButton');
                this.stopButton = document.getElementById('stopButton');
                this.clearButton = document.getElementById('clearButton');
                this.sendButton = document.getElementById('sendButton');
                this.typingIndicator = document.getElementById('typingIndicator');
                this.status = document.getElementById('status');
                this.keyboard = document.getElementById('keyboard');

                // Map all keyboard keys
                this.keyElements = {};
                document.querySelectorAll('.key').forEach(key => {
                    const keyChar = key.getAttribute('data-key');
                    this.keyElements[keyChar.toLowerCase()] = key;
                });
            }

            initEventListeners() {
                this.startButton.addEventListener('click', () => this.startTyping());
                this.stopButton.addEventListener('click', () => this.stopTyping());
                this.clearButton.addEventListener('click', () => this.clearChat());
                this.sendButton.addEventListener('click', () => this.sendMessage());

                this.typingSpeedInput.addEventListener('input', (e) => {
                    this.typingSpeed = parseInt(e.target.value);
                    this.speedValue.textContent = `${this.typingSpeed} мс`;
                });

                this.showKeyboardCheckbox.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        this.keyboard.classList.remove('hidden');
                    } else {
                        this.keyboard.classList.add('hidden');
                    }
                });

                this.showCursorCheckbox.addEventListener('change', (e) => {
                    this.showCursor = e.target.checked;
                    this.updateDisplay();
                });

                this.autoSendCheckbox.addEventListener('change', (e) => {
                    this.autoSend = e.target.checked;
                });

                this.autoReplyCheckbox.addEventListener('change', (e) => {
                    this.autoReply = e.target.checked;
                });

                this.textToTypeInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.startTyping();
                    }
                });
            }

            startTyping() {
                if (this.isTyping) {
                    this.updateStatus('Набор уже выполняется', false);
                    return;
                }

                this.textToType = this.textToTypeInput.value.trim();

                if (!this.textToType) {
                    this.updateStatus('Введите текст для набора', false);
                    return;
                }

                this.currentIndex = 0;
                this.isTyping = true;
                this.currentTextInput.value = '';
                // Don't show typing indicator for user's own typing
                this.updateStatus('Набираю текст...', true);
                this.scrollToBottom();

                this.typeNextCharacter();
            }

            typeNextCharacter() {
                if (!this.isTyping || this.currentIndex >= this.textToType.length) {
                    this.finishTyping();
                    return;
                }

                const char = this.textToType[this.currentIndex];

                // Animate keyboard key press
                this.animateKeyPress(char);

                this.currentTextInput.value += char;
                this.currentIndex++;

                this.updateDisplay();

                const delay = this.typingSpeed + (Math.random() * 50 - 25);
                this.typingTimeout = setTimeout(() => this.typeNextCharacter(), delay);
            }

            animateKeyPress(char) {
                const lowerChar = char.toLowerCase();
                let keyElement = null;

                // Handle space
                if (char === ' ') {
                    keyElement = this.keyElements[' '];
                } else {
                    // Try to find the key for this character
                    keyElement = this.keyElements[lowerChar];
                }

                if (keyElement) {
                    // Add pressed class
                    keyElement.classList.add('pressed');

                    // Remove pressed class after animation
                    setTimeout(() => {
                        keyElement.classList.remove('pressed');
                    }, 150);
                }

                // If character is uppercase, also animate shift key
                if (char !== lowerChar && char.match(/[A-Z]/)) {
                    const shiftKey = this.keyElements['⇧'];
                    if (shiftKey) {
                        shiftKey.classList.add('pressed');
                        setTimeout(() => {
                            shiftKey.classList.remove('pressed');
                        }, 150);
                    }
                }
            }

            updateDisplay() {
                let displayText = this.currentTextInput.value;

                if (this.showCursor && this.isTyping) {
                    this.currentTextInput.style.borderRight = '2px solid #fff';
                } else {
                    this.currentTextInput.style.borderRight = 'none';
                }
            }

            finishTyping() {
                this.isTyping = false;
                clearTimeout(this.typingTimeout);
                this.updateDisplay();

                if (this.autoSend && this.currentTextInput.value.trim()) {
                    setTimeout(() => {
                        this.sendMessage();
                        this.updateStatus('Сообщение отправлено', false);
                    }, 500);
                } else {
                    this.updateStatus('Набор завершен', false);
                    this.sendButton.disabled = false;
                }
            }

            stopTyping() {
                if (!this.isTyping) {
                    this.updateStatus('Набор не выполняется', false);
                    return;
                }

                this.isTyping = false;
                this.typingIndicator.classList.remove('active');
                clearTimeout(this.typingTimeout);
                this.updateDisplay();
                this.updateStatus('Набор остановлен', false);

                if (this.currentTextInput.value.trim()) {
                    this.sendButton.disabled = false;
                }
            }

            sendMessage() {
                const text = this.currentTextInput.value.trim();

                if (!text) return;

                // Remove status from ALL previous sent messages
                const allStatuses = this.messagesContainer.querySelectorAll('.message-status');
                allStatuses.forEach(status => status.remove());
                this.lastMessageStatus = null;

                // Create message wrapper
                const messageWrapper = document.createElement('div');
                messageWrapper.className = 'message-wrapper sent';

                // Create message bubble
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message sent';
                messageDiv.textContent = text;

                // Create status
                const statusDiv = document.createElement('div');
                statusDiv.className = 'message-status';
                statusDiv.textContent = 'Delivered';

                messageWrapper.appendChild(messageDiv);
                messageWrapper.appendChild(statusDiv);

                this.messagesContainer.insertBefore(messageWrapper, this.typingIndicator);
                this.currentTextInput.value = '';
                this.sendButton.disabled = true;
                this.lastMessageStatus = statusDiv;

                this.scrollToBottom();

                // Change status to "Read" after 1 second
                setTimeout(() => {
                    if (statusDiv.parentElement) {
                        statusDiv.textContent = 'Read';
                    }
                }, 1000);

                // Trigger auto-reply after 2 seconds (if enabled)
                if (this.autoReply) {
                    setTimeout(() => {
                        this.sendAutoReply();
                    }, 2000);
                }
            }

            sendAutoReply() {
                // Show typing indicator
                this.typingIndicator.classList.add('active');
                this.scrollToBottom();

                // Wait 2-4 seconds (random) then send reply
                const delay = 2000 + Math.random() * 2000;
                setTimeout(() => {
                    // Hide typing indicator
                    this.typingIndicator.classList.remove('active');

                    // Pick random reply
                    const reply = this.replyMessages[Math.floor(Math.random() * this.replyMessages.length)];

                    // Create message wrapper
                    const messageWrapper = document.createElement('div');
                    messageWrapper.className = 'message-wrapper received';

                    // Create message bubble
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'message received';
                    messageDiv.textContent = reply;

                    messageWrapper.appendChild(messageDiv);

                    this.messagesContainer.insertBefore(messageWrapper, this.typingIndicator);
                    this.scrollToBottom();
                }, delay);
            }

            clearChat() {
                const messages = this.messagesContainer.querySelectorAll('.message-wrapper');
                messages.forEach(msg => {
                    // Keep only the initial messages
                    const isInitial = msg.querySelector('.message.received')?.textContent === 'What did you do' ||
                                    msg.querySelector('.message.sent')?.textContent === 'Nothing lol';
                    if (!isInitial) {
                        msg.remove();
                    }
                });
                this.currentTextInput.value = '';
                this.sendButton.disabled = true;
                this.updateStatus('Чат очищен', false);
            }

            scrollToBottom() {
                setTimeout(() => {
                    this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
                }, 100);
            }

            updateStatus(message, isActive) {
                this.status.textContent = message;
                if (isActive) {
                    this.status.classList.add('active');
                } else {
                    this.status.classList.remove('active');
                }
            }
        }

        const simulator = new TextTypingSimulator();
    </script>
</body>
</html>
