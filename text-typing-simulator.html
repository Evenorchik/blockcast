<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор набора текста</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #1c1c1e;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid #2c2c2e;
        }

        .contact-name {
            font-size: 16px;
            font-weight: 600;
        }

        .contact-subtitle {
            font-size: 12px;
            color: #8e8e93;
            margin-top: 2px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 20px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.received {
            background: #3a3a3c;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        .message.sent {
            background: #0a84ff;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .typing-indicator {
            display: none;
            align-self: flex-end;
            padding: 8px 12px;
            font-size: 12px;
            color: #8e8e93;
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-indicator .dots {
            display: inline-block;
        }

        .typing-indicator .dots span {
            animation: blink 1.4s infinite;
            animation-fill-mode: both;
        }

        .typing-indicator .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 80%, 100% {
                opacity: 0;
            }
            40% {
                opacity: 1;
            }
        }

        .input-container {
            background: #1c1c1e;
            padding: 10px 15px;
            border-top: 1px solid #2c2c2e;
        }

        .input-wrapper {
            background: #3a3a3c;
            border-radius: 20px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .text-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        .text-input::placeholder {
            color: #8e8e93;
        }

        .send-button {
            background: #0a84ff;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-button:hover {
            background: #0066cc;
        }

        .send-button:disabled {
            background: #3a3a3c;
            cursor: not-allowed;
        }

        .control-panel {
            background: #2c2c2e;
            padding: 20px;
            border-top: 1px solid #3a3a3c;
        }

        .control-panel h3 {
            margin-bottom: 15px;
            font-size: 14px;
            color: #8e8e93;
            text-transform: uppercase;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .control-group input[type="text"],
        .control-group input[type="number"] {
            width: 100%;
            padding: 10px;
            background: #3a3a3c;
            border: 1px solid #48484a;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }

        .control-group input[type="range"] {
            width: 100%;
        }

        .control-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #0a84ff;
            color: #fff;
        }

        .btn-primary:hover {
            background: #0066cc;
        }

        .btn-secondary {
            background: #3a3a3c;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #48484a;
        }

        .speed-value {
            display: inline-block;
            margin-left: 10px;
            color: #0a84ff;
            font-weight: 600;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: #fff;
            margin-left: 2px;
            animation: cursorBlink 1s infinite;
        }

        @keyframes cursorBlink {
            0%, 49% {
                opacity: 1;
            }
            50%, 100% {
                opacity: 0;
            }
        }

        .status {
            margin-top: 10px;
            padding: 10px;
            background: #3a3a3c;
            border-radius: 8px;
            font-size: 12px;
            color: #8e8e93;
            text-align: center;
        }

        .status.active {
            background: #1e3a1e;
            color: #30d158;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="contact-name">My queen ❤️</div>
        <div class="contact-subtitle">онлайн</div>
    </div>

    <div class="messages-container" id="messagesContainer">
        <div class="message received">What did you do</div>
        <div class="message sent">Nothing lol</div>
        <div class="typing-indicator" id="typingIndicator">
            <span class="dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
    </div>

    <div class="input-container">
        <div class="input-wrapper">
            <input type="text" class="text-input" id="currentText" placeholder="Сообщение" readonly>
            <button class="send-button" id="sendButton" disabled>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="control-panel">
        <h3>Панель управления</h3>

        <div class="control-group">
            <label for="textToType">Текст для набора:</label>
            <input type="text" id="textToType" placeholder="Введите текст, например: I love you" value="Just getting some coffee">
        </div>

        <div class="control-group">
            <label for="typingSpeed">
                Скорость набора: <span class="speed-value" id="speedValue">100 мс</span>
            </label>
            <input type="range" id="typingSpeed" min="50" max="500" value="100" step="10">
        </div>

        <div class="control-group">
            <label>
                <input type="checkbox" id="showCursor"> Показывать курсор
            </label>
        </div>

        <div class="control-group">
            <label>
                <input type="checkbox" id="autoSend" checked> Автоматически отправлять сообщение
            </label>
        </div>

        <div class="control-buttons">
            <button class="btn btn-primary" id="startButton">▶ Начать набор</button>
            <button class="btn btn-secondary" id="stopButton">⏹ Остановить</button>
            <button class="btn btn-secondary" id="clearButton">🗑 Очистить чат</button>
        </div>

        <div class="status" id="status">Готов к работе</div>
    </div>

    <script>
        class TextTypingSimulator {
            constructor() {
                this.textToType = '';
                this.currentIndex = 0;
                this.typingSpeed = 100;
                this.isTyping = false;
                this.showCursor = false;
                this.autoSend = true;
                this.typingTimeout = null;

                this.initElements();
                this.initEventListeners();
            }

            initElements() {
                this.messagesContainer = document.getElementById('messagesContainer');
                this.currentTextInput = document.getElementById('currentText');
                this.textToTypeInput = document.getElementById('textToType');
                this.typingSpeedInput = document.getElementById('typingSpeed');
                this.speedValue = document.getElementById('speedValue');
                this.showCursorCheckbox = document.getElementById('showCursor');
                this.autoSendCheckbox = document.getElementById('autoSend');
                this.startButton = document.getElementById('startButton');
                this.stopButton = document.getElementById('stopButton');
                this.clearButton = document.getElementById('clearButton');
                this.sendButton = document.getElementById('sendButton');
                this.typingIndicator = document.getElementById('typingIndicator');
                this.status = document.getElementById('status');
            }

            initEventListeners() {
                this.startButton.addEventListener('click', () => this.startTyping());
                this.stopButton.addEventListener('click', () => this.stopTyping());
                this.clearButton.addEventListener('click', () => this.clearChat());
                this.sendButton.addEventListener('click', () => this.sendMessage());

                this.typingSpeedInput.addEventListener('input', (e) => {
                    this.typingSpeed = parseInt(e.target.value);
                    this.speedValue.textContent = `${this.typingSpeed} мс`;
                });

                this.showCursorCheckbox.addEventListener('change', (e) => {
                    this.showCursor = e.target.checked;
                    this.updateDisplay();
                });

                this.autoSendCheckbox.addEventListener('change', (e) => {
                    this.autoSend = e.target.checked;
                });

                this.textToTypeInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.startTyping();
                    }
                });
            }

            startTyping() {
                if (this.isTyping) {
                    this.updateStatus('Набор уже выполняется', false);
                    return;
                }

                this.textToType = this.textToTypeInput.value.trim();

                if (!this.textToType) {
                    this.updateStatus('Введите текст для набора', false);
                    return;
                }

                this.currentIndex = 0;
                this.isTyping = true;
                this.currentTextInput.value = '';
                this.typingIndicator.classList.add('active');
                this.updateStatus('Набираю текст...', true);
                this.scrollToBottom();

                this.typeNextCharacter();
            }

            typeNextCharacter() {
                if (!this.isTyping || this.currentIndex >= this.textToType.length) {
                    this.finishTyping();
                    return;
                }

                const char = this.textToType[this.currentIndex];
                this.currentTextInput.value += char;
                this.currentIndex++;

                this.updateDisplay();

                const delay = this.typingSpeed + (Math.random() * 50 - 25);
                this.typingTimeout = setTimeout(() => this.typeNextCharacter(), delay);
            }

            updateDisplay() {
                let displayText = this.currentTextInput.value;

                if (this.showCursor && this.isTyping) {
                    this.currentTextInput.style.borderRight = '2px solid #fff';
                } else {
                    this.currentTextInput.style.borderRight = 'none';
                }
            }

            finishTyping() {
                this.isTyping = false;
                this.typingIndicator.classList.remove('active');
                clearTimeout(this.typingTimeout);
                this.updateDisplay();

                if (this.autoSend && this.currentTextInput.value.trim()) {
                    setTimeout(() => {
                        this.sendMessage();
                        this.updateStatus('Сообщение отправлено', false);
                    }, 500);
                } else {
                    this.updateStatus('Набор завершен', false);
                    this.sendButton.disabled = false;
                }
            }

            stopTyping() {
                if (!this.isTyping) {
                    this.updateStatus('Набор не выполняется', false);
                    return;
                }

                this.isTyping = false;
                this.typingIndicator.classList.remove('active');
                clearTimeout(this.typingTimeout);
                this.updateDisplay();
                this.updateStatus('Набор остановлен', false);

                if (this.currentTextInput.value.trim()) {
                    this.sendButton.disabled = false;
                }
            }

            sendMessage() {
                const text = this.currentTextInput.value.trim();

                if (!text) return;

                const messageDiv = document.createElement('div');
                messageDiv.className = 'message sent';
                messageDiv.textContent = text;

                this.messagesContainer.insertBefore(messageDiv, this.typingIndicator);
                this.currentTextInput.value = '';
                this.sendButton.disabled = true;

                this.scrollToBottom();
            }

            clearChat() {
                const messages = this.messagesContainer.querySelectorAll('.message.sent');
                messages.forEach(msg => msg.remove());
                this.currentTextInput.value = '';
                this.sendButton.disabled = true;
                this.updateStatus('Чат очищен', false);
            }

            scrollToBottom() {
                setTimeout(() => {
                    this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
                }, 100);
            }

            updateStatus(message, isActive) {
                this.status.textContent = message;
                if (isActive) {
                    this.status.classList.add('active');
                } else {
                    this.status.classList.remove('active');
                }
            }
        }

        const simulator = new TextTypingSimulator();
    </script>
</body>
</html>
